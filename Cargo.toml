[package]
name = "infinity-kernel"
version = "0.0.1"
edition = "2021"

[lib]
path = "kernel/core/main.rs"
crate-type = ["staticlib"]

[features]
installer = []
streamed-payload = ["installer"]

[dependencies]
libm = { version = "0.2", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8.1", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
