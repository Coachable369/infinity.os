[package]
name = "infinity-face-worker"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"
crate-type = ["staticlib"]

[dependencies]
infinity-face-core = { path = "../infinity-face-core", features = ["native-jpeg"] }

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
