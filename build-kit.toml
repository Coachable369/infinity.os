version = 1
project = "InfinityOS"

[paths]
scratch = "build"
temporary = "build/tmp"
releases = "builds"
manifests = "builds/manifests"
models = "model-cache"
patches = "third_party/patches"
logs = "build/logs"

[log_retention]
remove_empty_release_logs = true
root_crash_globs = ["rustc-ice-*.txt"]

[profiles.full]
command = ["sh", "build.sh"]
clean = true

[profiles.incremental]
command = ["sh", "build.sh"]
clean = false

[profiles.package-aarch64]
command = ["sh", "build.sh", "--package-only", "--target", "aarch64"]
clean = false

[profiles.package-aarch64-qemu]
command = ["sh", "build.sh", "--package-only", "--target", "aarch64", "--machine", "qemu"]
clean = false

[profiles.package-x86_64]
command = ["sh", "build.sh", "--package-only", "--target", "x86_64"]
clean = false

[profiles.update-iso]
command = ["python3", "tools/update-ui-iso.py"]
clean = false

[profiles.update-iso-tests]
command = ["python3", "tools/update-ui-iso-test.py"]
clean = false

[profiles.x86_64]
command = ["sh", "build.sh", "--target", "x86_64"]
clean = false

[profiles.aarch64]
command = ["sh", "build.sh", "--target", "aarch64"]
clean = false

[profiles.x86_64-models]
command = ["sh", "build.sh", "--target", "x86_64"]
clean = false

[profiles.tests]
command = ["make", "test"]
clean = false

[profiles.face-aarch64]
command = ["sh", "tools/build-face-worker.sh", "aarch64"]
clean = false

[profiles.face-x86_64]
command = ["sh", "tools/build-face-worker.sh", "x86_64"]
clean = false

[profiles.face-inference-tests]
command = ["sh", "-c", "mkdir -p build/behavior-tests && rustc --edition=2021 -O -Awarnings tools/face-inference-batch-test.rs -o build/behavior-tests/face-inference-batch && build/behavior-tests/face-inference-batch"]
clean = false

[profiles.face-capture-tests]
command = ["sh", "-c", "mkdir -p build/behavior-tests && rustc --edition=2021 --test tools/face-capture-test.rs -o build/behavior-tests/face-capture-test && build/behavior-tests/face-capture-test && rustc --edition=2021 --test kernel/runtime/face_schedule.rs -o build/behavior-tests/face-schedule-test && build/behavior-tests/face-schedule-test"]
clean = false

[profiles.hermes-memory-tests]
command = ["make", "hermes-memory-test"]
clean = false

[profiles.file-preview-tests]
command = ["cargo", "test", "--manifest-path", "tools/file-preview-harness/Cargo.toml"]
clean = false

[profiles.window-controls-tests]
command = ["sh", "tools/window-controls-test.sh"]
clean = false

[profiles.native-process-tests]
command = ["sh", "-c", "rustc --edition=2021 -A warnings tools/native-memory-test.rs -o build/native-memory-test && build/native-memory-test && rustc --edition=2021 -A warnings tools/native-process-memory-test.rs -o build/native-process-memory-test && build/native-process-memory-test"]
clean = false

[profiles.native-controller-tests]
command = ["sh", "-c", "cc -std=c11 -Wall -Wextra -Werror tools/native-controller-test.c -o build/native-controller-test && build/native-controller-test"]
clean = false

[profiles.native-compiler-storage-tests]
command = ["sh", "-c", "mkdir -p build/native-c && rustc --edition=2021 -A warnings tools/native-c-probe/io-test.rs -o build/native-c/io-test && build/native-c/io-test"]
clean = false

[profiles.native-c-production-tests]
command = ["sh", "tools/native-c-production-test.sh"]
clean = false

[profiles.native-uikit-tests]
command = ["make", "native-uikit-test", "editor-assistant-test"]
clean = false

[profiles.application-interaction-tests]
command = ["sh", "tools/application-interaction-test.sh"]
clean = false

[profiles.application-interaction-model-test]
command = ["sh", "-c", "CARGO_TARGET_DIR=build/behavior-harness cargo run --quiet --release --manifest-path tools/behavior-harness/Cargo.toml --bin application-interaction-model-test"]
clean = false

[profiles.application-generation-repair-test]
command = ["sh", "-c", "CARGO_TARGET_DIR=build/behavior-harness cargo run --quiet --release --manifest-path tools/behavior-harness/Cargo.toml --bin application-interaction-model-test -- --repair"]
clean = false

[profiles.intelligence-kit-tests]
command = ["make", "intelligence-kit-test"]
clean = false

[profiles.native-process-supervision-tests]
command = ["sh", "-c", "rustc --edition=2021 -A warnings tools/native-process-supervision-test.rs -o build/native-process-supervision-test && build/native-process-supervision-test"]
clean = false

[profiles.browser-aarch64]
command = ["sh", "build.sh", "--target", "aarch64"]
clean = false

[profiles.browser-core-tests]
command = ["cargo", "test", "--manifest-path", "sdk/infinity-browser-core/Cargo.toml"]
clean = false

[profiles.enterprise-core-tests]
command = ["cargo", "test", "--manifest-path", "sdk/infinity-enterprise-core/Cargo.toml"]
clean = false

[profiles.studio]
domain = "studio"
command = ["zsh", "tools/installer-designer/build.sh"]
clean = false

[profiles.studio-build-kit-tests]
domain = "studio"
command = ["python3", "tools/build-kit-test.py"]
clean = false

[profiles.studio-clean]
domain = "studio"
command = ["zsh", "tools/installer-designer/build.sh", "--clean"]
clean = false

[profiles.studio-package]
domain = "studio"
command = ["zsh", "tools/installer-designer/build.sh", "--skip-tests"]
clean = false

[profiles.studio-image-fit-tests]
domain = "studio"
command = ["swift", "test", "--scratch-path", "builds/.studio-work/swift", "--cache-path", "builds/.studio-work/cache/swiftpm", "--config-path", "builds/.studio-work/cache/swiftpm-config", "--security-path", "builds/.studio-work/cache/swiftpm-security", "--package-path", "tools/installer-designer", "--filter", "ImageFitTests|DecorativeClipboardTests|RuntimeTemplateCodecTests"]
clean = false

[profiles.studio-glass-tests]
domain = "studio"
command = ["swift", "test", "--scratch-path", "builds/.studio-work/swift", "--cache-path", "builds/.studio-work/cache/swiftpm", "--config-path", "builds/.studio-work/cache/swiftpm-config", "--security-path", "builds/.studio-work/cache/swiftpm-security", "--package-path", "tools/installer-designer", "--filter", "GlassButtonTests|PrecisionPreviewTests"]
clean = false

[profiles.studio-login-tests]
domain = "studio"
command = ["swift", "test", "--scratch-path", "builds/.studio-work/swift", "--cache-path", "builds/.studio-work/cache/swiftpm", "--config-path", "builds/.studio-work/cache/swiftpm-config", "--security-path", "builds/.studio-work/cache/swiftpm-security", "--package-path", "tools/installer-designer", "--filter", "LoginSceneTests|RuntimeTemplateCodecTests.testStoreProtectsRequiredStructureAndAllowsOrdinaryLayerDeletion"]
clean = false

[profiles.studio-menu-tests]
domain = "studio"
command = ["swift", "test", "--scratch-path", "builds/.studio-work/swift", "--cache-path", "builds/.studio-work/cache/swiftpm", "--config-path", "builds/.studio-work/cache/swiftpm-config", "--security-path", "builds/.studio-work/cache/swiftpm-security", "--package-path", "tools/installer-designer", "--filter", "MenuEditorTests|DesktopSceneTests.testDesktopEditingRoundTrip|RuntimeTemplateCodecTests"]
clean = false

[profiles.studio-menu-native-tests]
domain = "studio"
command = ["sh", "tools/studio-menu-test.sh"]
clean = false

[profiles.studio-menu-kernel-check]
domain = "studio"
command = ["env", "RUSTC_BOOTSTRAP=1", "cargo", "check", "--offline", "--release", "-Z", "build-std=core", "--features", "native-browser"]
clean = false

[profiles.login-layout-tests]
command = ["sh", "-c", "rustc --edition=2021 -Awarnings tools/login-template-test.rs -o build/login-template-test && build/login-template-test"]
clean = false

[profiles.desktop-effects-tests]
command = ["sh", "-c", "rustc --edition=2021 --test tools/desktop-effects-test.rs -o build/desktop-effects-test && build/desktop-effects-test && rustc --edition=2021 --test tools/desktop-polish-test.rs -o build/desktop-polish-test && build/desktop-polish-test --test-threads=1 && rustc --edition=2021 --test tools/spatial-retained-test.rs -o build/spatial-retained-test && build/spatial-retained-test --test-threads=1"]
clean = false
