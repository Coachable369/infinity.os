version = 1
project = "InfinityOS"

[paths]
scratch = "build"
temporary = "build/tmp"
releases = "builds"
manifests = "builds/manifests"
models = "model-cache"
patches = "third_party/patches"
logs = "build/logs"

[log_retention]
remove_empty_release_logs = true
root_crash_globs = ["rustc-ice-*.txt"]

[profiles.full]
command = ["sh", "build.sh"]
clean = true

[profiles.incremental]
command = ["sh", "build.sh"]
clean = false

[profiles.x86_64]
command = ["sh", "build.sh", "--target", "x86_64"]
clean = false

[profiles.aarch64]
command = ["sh", "build.sh", "--target", "aarch64"]
clean = false

[profiles.x86_64-models]
command = ["sh", "build.sh", "--target", "x86_64"]
clean = false

[profiles.tests]
command = ["make", "test"]
clean = false

[profiles.browser-aarch64]
command = ["sh", "build.sh", "--target", "aarch64"]
clean = false

[profiles.browser-core-tests]
command = ["cargo", "test", "--manifest-path", "sdk/infinity-browser-core/Cargo.toml"]
clean = false

[profiles.studio]
command = ["sh", "tools/installer-designer/build.sh"]
clean = false
