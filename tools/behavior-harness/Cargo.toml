[package]
name = "infinityos-behavior-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8.1", default-features = false }

