[package]
name = "infinityos-milestone9-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
chacha20poly1305 = { version = "0.11.0-rc.2", default-features = false }
ed25519-dalek = { version = "3.0.0-rc.4", default-features = false, features = ["fast", "zeroize"] }
hkdf = { version = "0.13.0-rc.5", default-features = false }
sha2 = { version = "0.11.0-rc.5", default-features = false }
x25519-dalek = { version = "3.0.0-pre.5", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.8", default-features = false }

[[bin]]
name = "milestone9-harness"
path = "main.rs"
